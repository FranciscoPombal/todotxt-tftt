name: CI

on:
  push:
    branches: ["master"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # 1. Grab the code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install todo.sh (todotxt-cli) so integration tests can run
      - name: Install todo.sh
        run: |
          sudo apt-get update
          sudo apt-get install -y todotxt-cli
          sudo ln -s /usr/bin/todo-txt /usr/local/bin/todo.sh

      # 3. Install uv with caching
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Check formatting (Ruff)
        run: uv run ruff format --check .

      - name: Lint code (Ruff)
        run: uv run ruff check .

      - name: Type check (Pyright)
        run: uv run pyright

      - name: Type check (Mypy)
        run: uv run mypy .

      - name: Run tests
        run: uv run pytest
