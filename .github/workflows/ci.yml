name: CI

on:
  push:
    branches: ["master"]
  pull_request:

env:
  TODO_TXT_CLI_VERSION: "2.13.0"
  TODO_TXT_CLI_SHA256: "d3b925434029aac212213c103fb6573a4f960c74dd467a3efac9bd9afe89d15f"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # 1. Grab the code
      - name: Checkout repository
        uses: actions/checkout@v6

      # 2. Install todo.sh from the official GitHub release
      - name: Install todo.sh
        run: |
          curl -fsSL -o todo.txt_cli.tar.gz "https://github.com/todotxt/todo.txt-cli/releases/download/v${TODO_TXT_CLI_VERSION}/todo.txt_cli-${TODO_TXT_CLI_VERSION}.tar.gz"
          echo "${TODO_TXT_CLI_SHA256}  todo.txt_cli.tar.gz" | sha256sum -c -
          tar xzf todo.txt_cli.tar.gz
          sudo install -m 755 "todo.txt_cli-${TODO_TXT_CLI_VERSION}/todo.sh" /usr/local/bin/todo.sh
          install -m 644 "todo.txt_cli-${TODO_TXT_CLI_VERSION}/todo.cfg" ~/.todo.cfg
          rm -rf "todo.txt_cli-${TODO_TXT_CLI_VERSION}" todo.txt_cli.tar.gz

      # 3. Install uv with caching
      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Check formatting (Ruff)
        run: uv run ruff format --check .

      - name: Lint code (Ruff)
        run: uv run ruff check .

      - name: Type check (Pyright)
        run: uv run pyright

      - name: Type check (Mypy)
        run: uv run mypy .

      - name: Run tests
        run: uv run pytest
